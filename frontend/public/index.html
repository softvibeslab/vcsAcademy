<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
        <meta name="theme-color" content="#D4AF37" />
        <meta name="description" content="VCSA - Vacation Club Sales Academy. Your premium sales training platform for vacation club professionals." />

        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.json" />

        <!-- iOS Meta Tags -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="VCSA" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

        <title>VCSA - Sales Training Platform</title>

        <!-- Critical CSS for preventing flash -->
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #020204;
                color: #F1F5F9;
                font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* Loading state */
            #root {
                min-height: 100vh;
            }

            /* Safe area insets for notched devices */
            @supports (padding: max(0px)) {
                body {
                    padding-left: max(0px, env(safe-area-inset-left));
                    padding-right: max(0px, env(safe-area-inset-right));
                }
            }

            /* Prevent text size adjustment on orientation change */
            * {
                -webkit-text-size-adjust: 100%;
                -moz-text-size-adjust: 100%;
                text-size-adjust: 100%;
            }

            /* Smooth scrolling */
            html {
                scroll-behavior: smooth;
            }

            /* Prevent overscroll bounce on iOS */
            body {
                overscroll-behavior-y: contain;
            }

            /* Disable tap highlight */
            * {
                -webkit-tap-highlight-color: transparent;
            }

            /* Improve touch target sizes */
            button, a, input, select, textarea {
                min-height: 44px;
                min-width: 44px;
            }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

        <!-- Service Worker Registration -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then((registration) => {
                            console.log('SW registered: ', registration);
                        })
                        .catch((registrationError) => {
                            console.log('SW registration failed: ', registrationError);
                        });
                });
            }
        </script>
    </body>
</html>
