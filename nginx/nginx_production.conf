# ═══════════════════════════════════════════════════════════════
# VCSA Production Nginx Configuration
# ═══════════════════════════════════════════════════════════════
#
# Optimized Nginx configuration for VCSA production deployment
# Supports SSL, HTTP/2, security headers, and reverse proxy
#
# ═══════════════════════════════════════════════════════════════

# Upstream FastAPI backend
upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone \$binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone \$binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone \$binary_remote_addr zone=community_limit:10m rate=10r/m;

# ═══════════════════════════════════════════════════════════════
# HTTP Server - Redirect to HTTPS
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name api.vcsa.com www.vcsa.com vcsa.com;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://\$host\$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════
# HTTPS Server - Main API
# ═══════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vcsa.com;

    # ═══════════════════════════════════════════════════════════
    # SSL Configuration
    # ═══════════════════════════════════════════════════════════

    ssl_certificate /etc/letsencrypt/live/api.vcsa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vcsa.com/privkey.pem;

    # SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ═══════════════════════════════════════════════════════════
    # Security Headers
    # ═══════════════════════════════════════════════════════════

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Remove server version
    server_tokens off;

    # ═══════════════════════════════════════════════════════════
    # Logging
    # ═══════════════════════════════════════════════════════════

    access_log /var/log/nginx/vcsa-api-access.log;
    error_log /var/log/nginx/vcsa-api-error.log warn;

    # ═══════════════════════════════════════════════════════════
    # Client Limits
    # ═══════════════════════════════════════════════════════════

    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # ═══════════════════════════════════════════════════════════
    # Gzip Compression
    # ═══════════════════════════════════════════════════════════

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ═══════════════════════════════════════════════════════════
    # API Routes with Rate Limiting
    # ═══════════════════════════════════════════════════════════

    # Health check (no rate limiting)
    location = /api/health {
        proxy_pass http://fastapi_backend;
        access_log off;
    }

    # Authentication endpoints (strict rate limiting)
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://fastapi_backend;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
    }

    # Community endpoints (rate limiting)
    location /api/community/ {
        limit_req zone=community_limit burst=5 nodelay;
        proxy_pass http://fastapi_backend;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
    }

    # All other API endpoints (standard rate limiting)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://fastapi_backend;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ═══════════════════════════════════════════════════════════
    # Root Location
    # ═══════════════════════════════════════════════════════════

    location / {
        return 404;
    }
}

# ═══════════════════════════════════════════════════════════════
# HTTPS Server - Frontend (React)
# ═══════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vcsa.com vcsa.com;

    # SSL Configuration (same as API)
    ssl_certificate /etc/letsencrypt/live/api.vcsa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vcsa.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    server_tokens off;

    # Logging
    access_log /var/log/nginx/vcsa-frontend-access.log;
    error_log /var/log/nginx/vcsa-frontend-error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ═══════════════════════════════════════════════════════════
    # Static Files (React build output)
    # ═══════════════════════════════════════════════════════════

    root /var/www/vcsa/frontend/build;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Index.html (no cache)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA routing - all requests go to index.html
    location / {
        try_files \$uri \$uri/ /index.html;
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
